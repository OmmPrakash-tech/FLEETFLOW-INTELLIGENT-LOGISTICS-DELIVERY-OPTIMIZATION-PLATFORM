spring.application.name=fleetflow
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
fleetflow.jwt-secret=${JWT_SECRET}
fleetflow.cors-origin=${CORS_ORIGIN:http://localhost:5173}
fleetflow.demo-enabled=${DEMO_ENABLED:false}
fleetflow.demo-password=${DEMO_PASSWORD:}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=false
management.health.mail.enabled=${MAIL_ENABLED:false}
server.error.include-stacktrace=never
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
fleetflow.mail-enabled=${MAIL_ENABLED:false}
fleetflow.mail-from=${MAIL_FROM:noreply@fleetflow.local}
