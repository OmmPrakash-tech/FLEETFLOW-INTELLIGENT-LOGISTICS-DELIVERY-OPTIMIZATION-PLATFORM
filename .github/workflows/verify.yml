name: Verify FleetFlow
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fleetflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_PASSWORD: ci-ephemeral-only
      JWT_SECRET: ci-only-not-a-deployment-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: chmod +x backend/mvnw && cd backend && ./mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
  containers-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci-ephemeral-database-only
      JWT_SECRET: ci-only-not-a-deployment-secret-at-least-32-chars
      DEMO_ENABLED: 'true'
      DEMO_PASSWORD: ci-only-browser-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for database-backed readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness; then exit 0; fi
            sleep 3
          done
          exit 1
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - name: Container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=100
      - name: Stop ephemeral CI containers
        if: always()
        run: docker compose down
